###############################
# MEDIA SERVER - Docker Compose
# Rete esterna: proxy-manager
# Nessuna Web UI esposta sull'host (solo tramite reverse proxy)
# Cartelle media in italiano: Film / Serie TV
###############################

services:

  # ==================================================
  # JELLYFIN
  # Media server principale.
  # Organizza, scansiona e trasmette film e serie TV.
  # ==================================================
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/jellyfin:/config
      - ${DATA_DIR}/media:/media:ro
    expose:
      - "8096"
    networks:
      - proxy-manager

  # ==================================================
  # QBITTORRENT
  # Client torrent.
  # ==================================================
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_DIR}/qbittorrent:/config
      - ${DATA_DIR}/downloads:/downloads
    ports:
      - "6881:6881"
      - "6881:6881/udp"
    expose:
      - "8080"
    networks:
      - proxy-manager

  # ==================================================
  # RADARR
  # Gestione automatica dei film.
  # ==================================================
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/radarr:/config
      - ${DATA_DIR}/downloads:/downloads
      - ${DATA_DIR}/media/Film:/movies
    expose:
      - "7878"
    networks:
      - proxy-manager

  # ==================================================
  # SONARR
  # Gestione automatica delle serie TV.
  # ==================================================
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/sonarr:/config
      - ${DATA_DIR}/downloads:/downloads
      - ${DATA_DIR}/media/Serie TV:/tv
    expose:
      - "8989"
    networks:
      - proxy-manager

  # ==================================================
  # PROWLARR
  # Gestore centralizzato degli indexer.
  # ==================================================
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/prowlarr:/config
    expose:
      - "9696"
    networks:
      - proxy-manager

  # ==================================================
  # SEERR
  # Interfaccia per richiedere film e serie.
  # ==================================================
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/seerr:/app/config
    expose:
      - "5055"
    networks:
      - proxy-manager

  # ==================================================
  # FLARESOLVERR
  # Risolve i controlli Cloudflare degli indexer.
  # ==================================================
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ}
    expose:
      - "8191"
    networks:
      - proxy-manager

  # ==================================================
  # VIOLARR (ICVDB Torznab)
  # Indexer self-hosted orientato ai contenuti italiani.
  # Si collega a Prowlarr come Torznab.
  # Docs: https://xbit18.github.io/violarr/
  # ==================================================
  violarr:
    image: ghcr.io/xbit18/violarr:latest
    container_name: icvdb-torznab
    restart: unless-stopped
    volumes:
      - ${CONFIG_DIR}/violarr:/data
    expose:
      - "8000"
    networks:
      - proxy-manager

###############################
# RETE
###############################
networks:
  proxy-manager:
    external: true
